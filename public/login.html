<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <nav>

        <a href="/login.html">Login</a>

    </nav>

    <div class="container">

        <h1>Login Administrativo</h1>

        <form action="/login" method="POST">

            <label>Usuário:</label>

            <input type="text" name="usuario" required>

            <label>Senha:</label>

            <input type="password" name="senha" required>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
